[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --datadir=/var/lib/mysql --socket=/run/mysqld/mysqld.sock --pid-file=/run/mysqld/mysqld.pid --innodb-buffer-pool-filename=/var/lib/mysql/ib_buffer_pool --bind-address=127.0.0.1
priority=10
autorestart=true
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=python3 /opt/lampplus/worker.py
priority=20
autorestart=true
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php]
command=/usr/sbin/php-fpm8.5 -F
priority=30
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:panel]
command=/usr/bin/python3 -m gunicorn --no-control-socket --chdir /opt/lampplus/panel --bind 127.0.0.1:9000 --workers 2 --threads 4 --timeout 180 app:app
user=lampadmin
priority=40
autorestart=true
environment=PYTHONPATH="/opt/lampplus"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:filebrowser]
command=/usr/local/bin/filebrowser -c /var/lib/lampplus/filebrowser-config/config.yaml
directory=/var/lib/lampplus/filebrowser
user=lampfiles
priority=40
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:apache]
command=/usr/sbin/apachectl -D FOREGROUND
priority=50
autorestart=true
stopsignal=WINCH
environment=APACHE_RUN_DIR="/run/apache2",APACHE_PID_FILE="/run/apache2/apache2.pid",APACHE_RUN_USER="www-data",APACHE_RUN_GROUP="www-data",APACHE_LOG_DIR="/var/log/apache2"
