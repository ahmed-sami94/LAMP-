{% extends 'base.html' %}
{% block body %}
<main class="login">
  <a class="brand" href="/"><img src="/static/brand/logo.png" alt="" width="48" height="48">LAMP<span>+</span></a>
  <h1>Owner sign-in</h1>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <label>Username<input name="username" autocomplete="username" required autofocus maxlength="128"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
  <footer>LAMP+ <span>2.0.0-rc.1</span></footer>
</main>
{% endblock %}
