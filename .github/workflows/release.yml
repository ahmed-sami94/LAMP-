name: Publish LAMP+
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [candidate, stable]
        default: candidate
        required: true
      accept_candidate:
        description: Confirm the candidate acceptance evidence has been reviewed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lampplus-publication
  cancel-in-progress: false
jobs:
  candidate:
    if: inputs.phase == 'candidate'
    uses: ./.github/workflows/verify.yml
    with:
      publish_candidate: true
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  index:
    if: inputs.phase == 'candidate'
    needs: candidate
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.metadata.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: verification-*
          path: evidence
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Assemble tested architecture digests
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u ahmedsamigmail --password-stdin
          AMD64=$(cat evidence/verification-amd64/digest-amd64.txt)
          ARM64=$(cat evidence/verification-arm64/digest-arm64.txt)
          docker buildx imagetools create -t ahmedsamigmail/lampplus:2.0.0-rc.1 "$AMD64" "$ARM64"
          docker logout
      - id: metadata
        run: python3 tools/registry-metadata.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-metadata
          path: release-metadata.json
  pull:
    if: inputs.phase == 'candidate'
    needs: index
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m pip install requests
      - name: Pull and test published immutable image
        env:
          TEST_IMAGE: ahmedsamigmail/lampplus@${{ needs.index.outputs.digest }}
        run: |
          docker pull "$TEST_IMAGE"
          python3 -u tests/runtime.py
      - name: Remove test credentials and containers
        if: always()
        run: |
          rm -f artifacts/browser-secret
          docker rm -f lampplus-test || true
  candidate_release:
    needs: [index, pull]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: evidence
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: index.docker.io/ahmedsamigmail/lampplus
          subject-digest: ${{ needs.index.outputs.digest }}
      - name: Publish candidate and acceptance evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf verification-evidence.tar.gz -C evidence .
          gh release create v2.0.0-rc.1 evidence/release-metadata/release-metadata.json verification-evidence.tar.gz --target "$GITHUB_SHA" --prerelease --title 'LAMP+ 2.0.0-rc.1' --notes 'Release candidate. Review the attached architecture, runtime, browser, SBOM and security evidence before stable promotion.'
  stable:
    if: inputs.phase == 'stable' && inputs.accept_candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify candidate identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v2.0.0-rc.1 --pattern release-metadata.json
          python3 -c 'import json,os; m=json.load(open("release-metadata.json")); assert m["source_commit"] == os.environ["GITHUB_SHA"], "Promote the exact accepted source commit"'
      - name: Promote the accepted digest
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE=$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["image"])')
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u ahmedsamigmail --password-stdin
          docker buildx imagetools create --prefer-index=false -t ahmedsamigmail/lampplus:2.0.0 -t ahmedsamigmail/lampplus:2.0 -t ahmedsamigmail/lampplus:2 -t ahmedsamigmail/lampplus:latest "$IMAGE"
          docker logout
          gh release create v2.0.0 release-metadata.json --target "$GITHUB_SHA" --title 'LAMP+ 2.0.0' --notes 'Stable release promoted from the tested 2.0.0-rc.1 image digest. See the candidate release for complete acceptance evidence.'
