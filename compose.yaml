services:
  app:
    image: ahmedsamigmail/lampplus:2.0.0-rc.1
    build:
      context: .
      args:
        UBUNTU_IMAGE: ${UBUNTU_IMAGE:?Use the pinned base from dependencies.lock.json}
    environment:
      LAMP_ADMIN_HOST: ${LAMP_ADMIN_HOST:-localhost}
      LAMP_ADMIN_USER: ${LAMP_ADMIN_USER:-admin}
      LAMP_ADMIN_PASSWORD: ${LAMP_ADMIN_PASSWORD:?Set a unique admin password}
      LAMP_MODE: ${LAMP_MODE:-development}
      LAMP_PUBLIC_PORT: ${LAMP_HTTP_PORT:-8080}
    ports:
      - "127.0.0.1:${LAMP_HTTP_PORT:-8080}:80"
    volumes:
      - sites:/srv/sites
      - database:/var/lib/mysql
      - state:/var/lib/lampplus
      - backups:/var/backups/lampplus
    restart: unless-stopped
    stop_grace_period: 60s
volumes:
  sites:
  database:
  state:
  backups:
